
spring.datasource.url=jdbc:mysql://localhost:3306/dewudb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

mybatis.mapper-locations=classpath:mapper/**/*.xml



spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.url-pattern=/druid/*
spring.datasource.druid.stat-view-servlet.login-username=druid
spring.datasource.druid.stat-view-servlet.login-password=druid
spring.datasource.druid.stat-view-servlet.allow=
spring.datasource.druid.stat-view-servlet.deny=



spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
# Redis 本机连接配置（无密码，使用默认数据库）
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
# 使用 Redis 保存登录会话，连续 30 分钟未访问后过期。
spring.session.store-type=redis
spring.session.timeout=30m
# 隔离本项目的会话数据，避免和其他应用混用。
spring.session.redis.namespace=hashopping:session
# 保留原有会话 Cookie 名称，禁止 JavaScript 读取。
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
